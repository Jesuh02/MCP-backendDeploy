version: '3.8'

services:
  mcp-server:
    build: .
    container_name: tareamov-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MCP_HTTP_PORT=3000
      - HOST=0.0.0.0
    command: sh start.sh
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - mcp-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: tareamov-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mcp-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
