version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-backend
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh start.sh
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
