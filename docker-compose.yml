version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-backend
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - BIND_HOST=0.0.0.0
      - INTERFACE_HEARTBEAT_TIMEOUT_MS=3000
    volumes:
      - ./:/app
      - mcp_node_modules:/app/node_modules
    # Ensure dependencies exist in mounted node_modules volume, then start server
    command: sh -c "if [ ! -d node_modules/@octokit/rest ]; then npm install --omit=dev; fi; node index.js"
    restart: always
    extra_hosts:
      # Ensure containers can resolve the Docker host on systems that support host-gateway
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Aggressive healthcheck for local/dev. Also try resolving host.docker.internal so host networking is visible.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || wget --no-verbose --tries=1 --spider http://host.docker.internal:3000/health || wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 2
      start_period: 5s

volumes:
  mcp_node_modules:
