version: '3.8'

services:
  mcp-server:
    build: .
    container_name: mcp-backend
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    # Run Node directly to avoid shell script encoding issues from Windows-mounted files
    command: node index.js
    restart: always
    healthcheck:
      # Shorter healthcheck to detect container availability faster on local/dev setups
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/detailed || wget --no-verbose --tries=1 --spider http://localhost:3000/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
