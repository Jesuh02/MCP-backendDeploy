services:
  mcp-server:
    build: .
    container_name: mcp-backend
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - BIND_HOST=0.0.0.0
      - INTERFACE_HEARTBEAT_TIMEOUT_MS=3000
    volumes:
      - ./.env:/app/.env:ro
    # node_modules vienen del build de Docker — no se montan como volumen
    command: node index.js
    restart: always
    extra_hosts:
      # Ensure containers can resolve the Docker host on systems that support host-gateway
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Use Node's built-in fetch so the healthcheck does not depend on wget/curl
      # being installed in the slim runtime image.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

