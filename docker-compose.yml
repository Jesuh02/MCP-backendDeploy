version: '3.8'

services:
  mcp-server:
    build: .
    container_name: tareamov-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - mcp-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tareamov-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mcp-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
